name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site files
        run: |
          mkdir -p _site/Suprise _site/image
          cp -R Suprise/. _site/Suprise/
          cp image/firstdate.jpg image/firstmonth.jpg image/2ndmonth.jpg image/3rdmonth.jpg image/2nddate.jpg image/firstlongcall.jpg image/alittlecelebration.jpg image/amomenticherished.jpg _site/image/
          printf '%s\n' '<!doctype html>' '<html lang="en">' '<head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./Suprise/"><title>A little something for you</title></head>' '<body><p><a href="./Suprise/">Open the surprise</a></p></body>' '</html>' > _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4